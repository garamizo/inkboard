; inkboard firmware - PlatformIO project
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = supermini-c6

[env:supermini-c6]
; The official espressif32 platform ships Arduino core 2.x, which has no
; ESP32-C6 support. pioarduino is the community-maintained platform that
; tracks Arduino-ESP32 3.x (built on ESP-IDF 5.x).
; Pinned release: Arduino-ESP32 3.3.12 / ESP-IDF 5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; The SuperMini has 4 MB flash (the DevKitC-1 profile assumes 8 MB).
board_upload.flash_size = 4MB
; min_spiffs: two 1.9 MB app slots (room to grow, keeps OTA updates possible).
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; Serial goes over the native USB-C port (USB-Serial-JTAG), no UART adapter needed.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    zinggjm/GxEPD2@^1.6.9

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Bare-minimum display check (extras/minimal), mirroring the kit's reference
; firmware. Flash with: pio run -e minimal -t upload -t monitor
[env:minimal]
extends = env:supermini-c6
build_src_filter = -<*> +<../extras/minimal/>

; Same, but with the kit's pin map (VoIPshare esp32_c6_supermini preset).
[env:minimal-kit-pins]
extends = env:minimal
build_flags = ${env:supermini-c6.build_flags} -DKIT_PINS

; Hardware smoke test (extras/smoke): pin diagnostics + refresh soak loop.
; Flash with: pio run -e smoke -t upload -t monitor   (or: just flash smoke)
[env:smoke]
extends = env:supermini-c6
build_src_filter = -<*> +<../extras/smoke/>

; Host-side unit tests for the pure logic in include/ (no hardware):  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
